name: Compilar APK Android
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

# Cada push a la misma rama cancela la compilación anterior. Los tags
# de publicación usan otro grupo para que no los cancele un push a main.
concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verificar Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Instalar componentes Android
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Preparar firma permanente
        shell: bash
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$SIGNING_KEY_BASE64"
          test -n "$SIGNING_STORE_PASSWORD"
          test -n "$SIGNING_KEY_ALIAS"
          printf '%s' "$SIGNING_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/misfinanzas-release.p12"
          chmod 600 "$RUNNER_TEMP/misfinanzas-release.p12"
          echo "SIGNING_STORE_FILE=$RUNNER_TEMP/misfinanzas-release.p12" >> "$GITHUB_ENV"
      - name: Verificar almacén de firma con Java
        shell: bash
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -s "$SIGNING_STORE_FILE"
          keytool -list -storetype PKCS12 -keystore "$SIGNING_STORE_FILE" -storepass:env SIGNING_STORE_PASSWORD > /dev/null
          echo "Almacén PKCS12 legible por Java."
          SIGNING_STORE_PASSWORD="$SIGNING_STORE_PASSWORD" SIGNING_KEY_ALIAS="$SIGNING_KEY_ALIAS" python3 - <<'PY'
          import os, subprocess, sys
          cmd = ["keytool", "-list", "-storetype", "PKCS12", "-keystore", os.environ["SIGNING_STORE_FILE"], "-storepass:env", "SIGNING_STORE_PASSWORD"]
          output = subprocess.run(cmd, capture_output=True, text=True, check=True).stdout
          alias = os.environ["SIGNING_KEY_ALIAS"]
          if not any(line.strip().startswith(alias + ",") and "PrivateKeyEntry" in line for line in output.splitlines()):
              sys.exit("No se encontró una entrada de clave privada con el alias configurado.")
          print("Alias y entrada de clave privada verificados.")
          PY
      - name: Compilar APK release firmado
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        run: gradle --no-daemon :app:assembleRelease
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: MisFinanzas-release-firmado
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 7
      - name: Eliminar clave temporal
        if: always()
        run: rm -f "$RUNNER_TEMP/misfinanzas-release.p12"

  release:
    name: Publicar APK etiquetado
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: MisFinanzas-release-firmado
          path: release
      - name: Crear GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -s release/app-release.apk
          gh release create "$GITHUB_REF_NAME"             "release/app-release.apk#MisFinanzas-$GITHUB_REF_NAME.apk"             --repo "$GITHUB_REPOSITORY"             --title "Mis Finanzas $GITHUB_REF_NAME"             --generate-notes

