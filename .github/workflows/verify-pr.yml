name: Verificar Android en pull request
on:
  pull_request:
    branches: [main]

jobs:
  compile:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
      - name: Instalar SDK Android
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0"
      - name: Probar lector de correos bancarios
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Compilar APK de prueba (sin firma de publicación)
        run: gradle --no-daemon :app:assembleDebug
